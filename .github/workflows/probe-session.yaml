name: Probe session

# A booted iPhone on the nightly's runner for an hour, running each probe pushed to this repo's probe-commands branch and
# pushing what it printed to probe-results, for a fact in a minute where a run takes 25: scripts/probe-session.sh FILE
# sends one and prints its result. A probe runs in this checkout with UDID set, for at most 10 minutes; one holding only
# `exit-session` ends the session. It runs what anyone who may push to this repository pushes there, as any workflow
# does; dispatch it only while probing. With world on, it has what a real case needs, for one case in a minute or two on
# the nightly's runner where a run of them takes an hour; with home on, the Home Screen app too:
#   SCENARIO_PAIRS=chromium:ios-home node --test --test-force-exit --test-name-pattern='lines that wrap' scenarios/browsers.e2e.ts
on:
  workflow_dispatch:
    inputs:
      world:
        description: Install what a real case needs
        type: boolean
        default: false
      home:
        description: Put the Home Screen app on the iPhone
        type: boolean
        default: false
permissions: {}
defaults:
  run:
    shell: bash -e -o pipefail {0}

jobs:
  session:
    # the nightly's iOS runner: macOS 27 with Xcode 27 and iOS 27.0
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      IPHONE: iPhone 13 mini
      # mise.ios.toml: the runner's own Xcode 27 for the iPhone, not mise.toml's 26.6 for the Mac
      MISE_ENV: ios
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # it pushes its results
        persist-credentials: true
    # as the nightly does
    - name: Keep the servers' ports free
      if: ${{ inputs.world }}
      run: scripts/reserve-ports.sh
    - name: Turn Spotlight off
      if: ${{ inputs.world }}
      run: sudo mdutil -a -i off || echo "::warning::Spotlight stays on"
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
    - name: Install the toolchain
      run: npm ci
    - name: Install the relay
      if: ${{ inputs.world }}
      run: npm ci --prefix relay
    # as the nightly does: CoreSimulator's own cache folders keep the iPhone's log from composing
    - name: Leave the iPhone its runtime's own shared cache
      run: xcrun simctl runtime dyld_shared_cache remove --all
    - name: Start booting an iPhone
      run: node scripts/ios.ts --start ${{ inputs.home && '--home' || '' }}
    - if: ${{ inputs.world }}
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        extensions: pdo_sqlite
        php-version: '8.4'
        tools: none
    - if: ${{ inputs.world }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        path: ~/Library/Caches/ms-playwright
    - name: Install Chromium
      if: ${{ inputs.world }}
      run: npx playwright-core install chromium
    - name: Install idb
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: brew install facebook/fb/idb-companion
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    # booted, not settled: a probe sees the load as it is, and notes it
    - name: Settle the iPhone, as the nightly does
      if: ${{ inputs.world }}
      timeout-minutes: 15
      run: node scripts/ios.ts ${{ inputs.home && '--home' || '' }}
    - name: Boot the iPhone
      timeout-minutes: 15
      run: |
        udid=$(xcrun simctl list devices booted --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
        xcrun simctl bootstatus "$udid" -b > /dev/null
        echo "UDID=$udid" >> "${GITHUB_ENV}"
    - name: Probes
      timeout-minutes: 62
      run: |
        git config user.name "probe session"
        git config user.email "probe-session@users.noreply.github.com"
        res="$RUNNER_TEMP/results"
        if git fetch --quiet origin probe-results 2>/dev/null; then git worktree add --quiet -B probe-results "$res" FETCH_HEAD; else git worktree add --quiet --orphan -b probe-results "$res"; fi
        mkdir -p "$res/results"
        # results/NAME on probe-results, pushed: the session is its only writer. A push GitHub refuses, as it once did with
        # "fatal error in commit_refs_rules", must not end the session and its iPhone
        publish() { cp "$1" "$res/results/$2"; git -C "$res" add results; git -C "$res" commit --quiet --message "$2"; for wait in 5 15 45; do git -C "$res" push --quiet --force origin HEAD:probe-results && return; sleep "$wait"; done; echo "::warning::$2 stays unpushed, until a later result's push"; }
        { echo "udid $UDID"; echo "load $(sysctl -n vm.loadavg)"; echo "at $(date -u +%FT%TZ)"; echo "run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > "$RUNNER_TEMP/ready.txt"
        last=$(git ls-remote origin refs/heads/probe-commands | cut -f1)
        publish "$RUNNER_TEMP/ready.txt" ready.txt
        end=$(( SECONDS + 3600 ))
        while [ $SECONDS -lt $end ]; do
          sleep 10
          sha=$(git ls-remote origin refs/heads/probe-commands | cut -f1)
          if [ -z "$sha" ] || [ "$sha" = "$last" ]; then continue; fi
          last=$sha
          git fetch --quiet origin probe-commands
          git show "$sha:run.sh" > "$RUNNER_TEMP/run.sh"
          [ "$(tr -d '[:space:]' < "$RUNNER_TEMP/run.sh")" = "exit-session" ] && break
          out="$RUNNER_TEMP/$sha.txt"
          t=$SECONDS
          set +e
          bash -e -o pipefail "$RUNNER_TEMP/run.sh" > "$out" 2>&1 &
          pid=$!
          ( sleep 600; kill -TERM "$pid" 2> /dev/null ) &
          killer=$!
          wait "$pid"
          code=$?
          kill "$killer" 2> /dev/null
          set -e
          { echo; echo "exit $code after $(( SECONDS - t )) s, load $(sysctl -n vm.loadavg), $(date -u +%FT%TZ)"; } >> "$out"
          publish "$out" "$sha.txt"
        done
