name: Mutation

# The web core's and BreezyKit's unit tests held to their mutation scores (scripts/mutate.ts): a module scoring below its
# floor in scripts/mutation-floors.json fails, and each module's surviving changes are kept.
on:
  schedule:
  - cron: "29 5 * * 2"
  workflow_dispatch:
permissions: {}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Mutation
      run: node scripts/mutate.ts --module web/
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: mutation-web
        path: build/mutation
        if-no-files-found: ignore
  breezykit:
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    # the Xcode the other jobs build with
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
    - name: Mutation
      run: node scripts/mutate.ts --module BreezyKit/
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: mutation-breezykit
        path: build/mutation
        if-no-files-found: ignore
  # a red week told no one: the run of 2026-11-03 stood for two days before a look at CI found it
  report:
    needs: [web, breezykit]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
    - name: Keep an issue open while it is red
      env:
        RESULTS: ${{ toJSON(needs) }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        red=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<< "$RESULTS")
        open=$(gh issue list --label mutation --state open --limit 1 --json number --jq '.[0].number // empty')
        if [ -n "$red" ]; then
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Red again on $(date -u +%F): $red — $RUN_URL"
          else
            gh label create mutation --force
            gh issue create --label mutation --title "Mutation red since $(date -u +%F)" --body "Red: $red — $RUN_URL"
          fi
        elif [ -n "$open" ]; then
          gh issue close "$open" --comment "Green on $(date -u +%F): $RUN_URL"
        fi
