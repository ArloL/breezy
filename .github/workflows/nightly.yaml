name: Nightly

# The measured network feel and the Mac's performance journal, each against baselines in scripts/baselines/ that runners
# recorded: a run fails when a measure's 95 % CI lies wholly above every baseline's. One runner can measure 40 % slower
# than the next, so the baselines are several runs' artifacts; one that fails on such a runner joins them. Pull requests
# that change what is measured or the baselines run it too.
on:
  schedule:
  - cron: "23 2 * * *"
  workflow_dispatch:
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/nightly.yaml
    - scripts/baselines/**
    - scripts/gate.ts
    - scripts/feel.ts
    - scripts/bench.sh
    - Breezy/Support/Bench.swift
permissions: {}

jobs:
  feel:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
    - name: Install PHP
      run: command -v php || brew install php
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    # Playwright's CDN drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium, WebKit and Firefox
      run: npx playwright-core install chromium webkit firefox
    # over the relay only: GitHub's macOS runners open no WebRTC channel
    - name: Measure
      run: |
        set -o pipefail
        mkdir -p build
        node scripts/feel.ts | tee build/feel.txt
        tail -n 1 build/feel.txt > build/feel.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: feel
        path: build/feel.json
    - name: Compare with the baseline
      run: |
        shopt -s nullglob
        baselines=(scripts/baselines/feel/*.json)
        if [ ${#baselines[@]} -eq 0 ]; then
          echo "::notice::No baselines in scripts/baselines/feel/: this run's artifact can be one"
          exit 0
        fi
        node scripts/gate.ts build/feel.json "${baselines[@]}"
  bench:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
    - name: Generate project
      run: xcodegen generate
    - name: Build
      run: |
        xcodebuild \
          -project Breezy.xcodeproj \
          -scheme Breezy \
          -configuration Release \
          -derivedDataPath build \
          build
    - name: Measure
      run: |
        printf '{"format": 1, "cards": [], "lanes": []}' > build/empty.breezy
        python3 scripts/make-stress-board.py build/stress.breezy
        scripts/bench.sh nightly 10 build/empty.breezy build/stress.breezy
        python3 scripts/bench-summary.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bench
        path: build/bench.jsonl
    - name: Compare with the baseline
      run: |
        shopt -s nullglob
        baselines=(scripts/baselines/bench/*.jsonl)
        if [ ${#baselines[@]} -eq 0 ]; then
          echo "::notice::No baselines in scripts/baselines/bench/: this run's artifact can be one"
          exit 0
        fi
        node scripts/gate.ts build/bench.jsonl "${baselines[@]}"
