name: Nightly

# The measured network feel against baselines in scripts/baselines/feel that runners recorded, and the Mac's performance
# journal against a reference build measured on the same runner: a run fails when a measure's 95 % CI lies wholly above
# every baseline's. One runner can measure 40 % slower than the next, so the feel's baselines are several runs'
# artifacts; one that fails on such a runner joins them. A deliberate change in the Mac's performance moves
# scripts/baselines/bench-ref to the commit that made it. And the sync fuzzed on seeds no run tried before. Pull requests
# that change what is measured or the baselines run it too.
on:
  schedule:
  - cron: "23 2 * * *"
  workflow_dispatch:
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/nightly.yaml
    - scripts/baselines/**
    - scripts/gate.ts
    - scripts/feel.ts
    - scripts/bench.sh
    - Breezy/Support/Bench.swift
    - scripts/fuzz.ts
permissions: {}

jobs:
  feel:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # a connection whose own port is a server's keeps that server from starting
    # Spotlight indexes the fresh runner and every build for its first half hour, which would count in what is measured
    - name: Turn Spotlight off
      run: sudo mdutil -a -i off
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
    - name: Install PHP
      run: command -v php || brew install php
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    # Playwright's CDN drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium, WebKit and Firefox
      run: npx playwright-core install chromium webkit firefox
    # over the relay only: GitHub's macOS runners open no WebRTC channel
    - name: Measure
      run: |
        set -o pipefail
        mkdir -p build
        node scripts/feel.ts | tee build/feel.txt
        tail -n 1 build/feel.txt > build/feel.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: feel
        # and what the relay, the server and the browsers said
        path: |
          build/feel.json
          build/feel-*.log
    - name: Compare with the baseline
      run: |
        shopt -s nullglob
        baselines=(scripts/baselines/feel/*.json)
        if [ ${#baselines[@]} -eq 0 ]; then
          echo "::notice::No baselines in scripts/baselines/feel/: this run's artifact can be one"
          exit 0
        fi
        node scripts/gate.ts build/feel.json "${baselines[@]}"
  # this commit's Release build against the reference's in scripts/baselines/bench-ref, on the same runner and in turns:
  # one runner measured zoom 4 times slower than the next, which no baseline from other runners could allow for
  bench:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # the reference too
        fetch-depth: 0
    # Spotlight indexes the fresh runner and every build for its first half hour, which would count in what is measured
    - name: Turn Spotlight off
      run: sudo mdutil -a -i off
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
    - name: Build this commit and the reference
      run: |
        git worktree add "$RUNNER_TEMP/ref" "$(cat scripts/baselines/bench-ref)"
        # mise trusts this checkout's config, not the reference's
        xcodegen=$(mise which xcodegen)
        for dir in . "$RUNNER_TEMP/ref"; do
          (
            cd "$dir"
            "$xcodegen" generate
            xcodebuild \
              -project Breezy.xcodeproj \
              -scheme Breezy \
              -configuration Release \
              -derivedDataPath build \
              build
          )
        done
    - name: Measure
      run: |
        printf '{"format": 1, "cards": [], "lanes": []}' > build/empty.breezy
        python3 scripts/make-stress-board.py build/stress.breezy
        # in turns, so that what slows the runner for a while slows both alike
        for _ in $(seq 10); do
          BENCH_BUILD="$RUNNER_TEMP/ref/build" BENCH_OUT=build/bench-ref.jsonl scripts/bench.sh ref 1 build/empty.breezy build/stress.breezy
          scripts/bench.sh nightly 1 build/empty.breezy build/stress.breezy
        done
        python3 scripts/bench-summary.py
        python3 scripts/bench-summary.py build/bench-ref.jsonl
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bench
        path: build/bench*.jsonl
    - name: Compare with the reference
      run: node scripts/gate.ts build/bench.jsonl build/bench-ref.jsonl
  # New seeds every night, with the network profile and the mix of web and Swift devices in turn: Main fuzzes seeds 1–10
  # of one mix only. A failing seed's trace and the smallest one that still fails are in the fuzz artifact; replay one
  # with node scripts/fuzz.ts --replay FILE.
  fuzz:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
    - name: Install PHP
      run: command -v php || brew install php
    - name: Install the relay
      run: npm ci --prefix relay
    - name: Build breezy-sim
      run: swift build --package-path BreezyKit --product breezy-sim
    - name: Fuzz
      run: |
        profiles=(mixed lan office train tether blocked-ws)
        mixes=("2 2" "3 1" "1 3" "4 0" "0 4")
        day=$(( $(date -u +%s) / 86400 ))
        profile=${profiles[$(( day % ${#profiles[@]} ))]}
        read -r web swift <<< "${mixes[$(( day / ${#profiles[@]} % ${#mixes[@]} ))]}"
        # past Main's seeds, and none twice in years
        first=$(( 11 + day % 10000 * 120 ))
        echo "::notice::seeds $first-$(( first + 119 )), profile $profile, $web web and $swift Swift devices"
        node scripts/fuzz.ts --seeds "$first-$(( first + 119 ))" --profile "$profile" --web "$web" --swift "$swift" --shrink
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ failure() }}
      with:
        name: fuzz
        path: build/fuzz
