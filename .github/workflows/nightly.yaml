name: Nightly

# What the checks on a pull request leave to the night (TESTING.md, "The nightly"): every case on every real device,
# the measures against their baselines, the sync fuzzed on seeds no run tried before, and the real devices' plants. One
# summary of all of it, and an issue labelled nightly for as long as a night is red; a red is a bug, fixed before new
# features. Never on a pull request, whose checks are Main's alone: dispatch it on a branch to try one on real devices,
# naming the one part wanted, as a whole night's five macOS jobs keep the gate's waiting for runners; a branch's run
# tells the issue nothing.
#
# The measured network feel and the Mac's performance journal, each against the reference build in
# scripts/baselines/bench-ref measured on the same runner in turns: a run fails when a measure's 95 % CI lies wholly
# above the reference's. One runner can measure 40 % slower than the next, which no baseline from other runners could
# allow for. A deliberate change in feel or performance moves bench-ref to the commit that made it.
on:
  schedule:
  # GitHub starts it ~5.5 h late, 07:40–08:05 UTC
  - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "The part to run: all, desktop, android, ios, or the measures (feel, bench, launch, fuzz)"
        type: choice
        options: [all, desktop, android, ios, measures]
        default: all
      video:
        description: "Film the devices' screens, keeping a failing case's films, or every case's"
        type: choice
        options: [none, failures, all]
        default: none
permissions: {}
# scenarios/browser.ts's SCENARIO_VIDEO: 1 keeps a failing case's films, all every case's
env:
  SCENARIO_VIDEO: ${{ inputs.video == 'failures' && '1' || inputs.video == 'all' && 'all' || '' }}

jobs:
  # every case on the desktop browsers and the Mac app, each kind acting once and watching once; the Mac acts here alone
  desktop:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'desktop' }}
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      contents: read
    # every night films the browsers and keeps a failing case's films, unless dispatched with none: a desktop night with
    # films ran no slower than one without (2026-10-28, its runner the less loaded)
    env:
      SCENARIO_VIDEO: ${{ inputs.video == 'all' && 'all' || inputs.video != 'none' && '1' || '' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # a connection whose own port is a server's keeps that server from starting
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    # Spotlight indexes the fresh runner and every build for its first half hour, which kept the load at 18 on 3 CPUs
    # while Firefox ran every timer 100 ms late
    - name: Turn Spotlight off
      # a nicety, not a condition: mdutil once exited non-zero after saying it had done it, and took the job with it
      run: sudo mdutil -a -i off || echo "::warning::Spotlight stays on"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
    - name: Install PHP
      run: command -v php || brew install php
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    # Playwright's CDN drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium, WebKit and Firefox
      run: npx playwright-core install chromium webkit firefox
    - name: Build the Mac app
      run: |
        xcodegen generate
        xcodebuild -project Breezy.xcodeproj -scheme Breezy -configuration Debug -derivedDataPath build build
    - name: Scenarios on real devices
      timeout-minutes: 45
      env:
        SCENARIO_PAIRS: chromium:webkit webkit:firefox firefox:mac mac:chromium
      # a handle left open once kept node from exiting after the last case, until the job timed out
      run: node --test --test-force-exit scenarios/browsers.e2e.ts
    - name: Count the cases
      if: ${{ always() }}
      run: node scripts/scenario-stats.ts build/scenarios >> "$GITHUB_STEP_SUMMARY"
    # passing too, as a failure is read against a pass
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: scenarios-desktop
        path: build/scenarios
        if-no-files-found: ignore
    # every case on the hub's fakes, each run's recordings kept, for the summary to hold the fakes to the real devices
    - name: The hub's cases, recorded
      if: ${{ !cancelled() }}
      timeout-minutes: 15
      env:
        HUB_RECORDS: all
      run: |
        swift build --package-path BreezyKit --product breezy-sim
        node --test --test-force-exit scenarios/cases.test.ts
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: hub-fakes
        path: build/hub
        if-no-files-found: ignore
    # the real devices' plants, whatever the cases before did: a board that cannot open offline, in Chromium; their
    # records under build/plants, apart from the cases'
    - name: Plants
      if: ${{ !cancelled() }}
      timeout-minutes: 10
      run: node scripts/plants.ts --level L6
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: plants-L6
        path: build/plants
        if-no-files-found: ignore
  # The scenarios' Android pairs, Chrome's and Firefox's, on an emulator: GitHub's Linux runners have KVM, its macOS runners
  # cannot run one: Apple Silicon has no nested virtualization (the emulator segfaulted booting in software), and the
  # Intel one, which has it, had not booted after 14 min (probed 2026-10-28, run 40655831748)
  android:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'android' }}
    runs-on: ubuntu-latest
    # apt and the scenarios each take half again as long on some runners
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MISE_ENV: android
      # no Linux build
      MISE_DISABLE_TOOLS: xcodegen
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # a connection whose own port is a server's keeps that server from starting
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
    - name: Install zsh, PHP's SQLite and KVM access
      run: |
        # a mirror mid-sync fails a download now and then
        sudo apt-get --option Acquire::Retries=5 update
        sudo apt-get --option Acquire::Retries=5 install --yes zsh php-cli php-sqlite3
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    # Playwright's CDN drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    # the packages WebKit needs, 119 MB, which Azure's Ubuntu mirror served in 9 s to one runner and in 21 min to another
    # the runner's image, which only its shell has, not the workflow's env
    - id: image
      run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
    # by the runner's image, newest first: a cache saved on Ubuntu 24 matched on Ubuntu 26, so the Ubuntu 26 packages were
    # never saved, and each run took 35 to 48 minutes downloading them from a slow mirror
    - id: apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: apt-playwright-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: apt-playwright-${{ runner.os }}-${{ steps.image.outputs.os }}-
    # the browsers the Android devices pair with
    - name: Install Chromium and WebKit
      # well within the job's time, as a mirror that stalls takes it all
      timeout-minutes: 15
      run: |
        echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded
        # a stalled download again after 30 s rather than waiting out the mirror: it stalled 1 to 5 minutes at a time
        printf 'Acquire::http::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99retries
        if compgen -G ~/apt-archives/'*.deb' > /dev/null; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/; fi
        npx playwright-core install --with-deps chromium webkit
    # what came down kept, even when the mirror ran out the step's time, so that the next run goes on from it; only when
    # something came that the cache lacked, as a key is never written twice
    - name: Keep the downloaded packages
      id: apt-new
      if: ${{ !cancelled() }}
      run: |
        mkdir -p ~/apt-archives
        count() { find ~/apt-archives -name '*.deb' | wc -l; }
        before=$(count)
        for f in /var/cache/apt/archives/*.deb; do [ -e "$f" ] && [ ! -e ~/apt-archives/"${f##*/}" ] && cp "$f" ~/apt-archives/; done
        echo "new=$(( $(count) - before ))" >> "$GITHUB_OUTPUT"
    - if: ${{ !cancelled() && steps.apt-new.outputs.new != '0' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}
    # the emulator and its system image, which scripts/android.ts installs: Google's server drops a download now and then;
    # keyed on its list of them alone, as each change to the script saved another 3 GB
    - id: sdk-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise/installs/android-sdk
        key: android-sdk-${{ runner.os }}-${{ hashFiles('mise.android.toml', 'scripts/android-sdk.ts') }}
        # a changed list starts from the SDK before it and downloads only what is new
        restore-keys: android-sdk-${{ runner.os }}-
    # the emulator booted, set up and snapshotted, which loads in seconds where a cold boot took 2.6 minutes
    - id: avd-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/avd.tar.zst
        key: avd-${{ runner.os }}-${{ hashFiles('mise.android.toml', 'scripts/android-sdk.ts', 'scripts/android.ts', 'scripts/android-snapshot.sh') }}
    - name: Unpack the emulator's snapshot
      if: ${{ steps.avd-cache.outputs.cache-hit == 'true' }}
      run: mise exec -- scripts/android-snapshot.sh unpack ~/avd.tar.zst
    - name: Boot the emulator
      id: boot
      # twice, if need be
      timeout-minutes: 16
      run: mise exec -- scripts/android-boot.sh
    # saved by main alone: a pull request's copy is its own, 3 GB each, and two of them and a stale one filled the
    # repository's 10 GB of caches
    - if: ${{ github.ref == 'refs/heads/main' && steps.sdk-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise/installs/android-sdk
        key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
    # each of the emulator's browsers acting once and watching once, as the two never share its screen
    - name: Scenarios on Android
      timeout-minutes: 50
      env:
        SCENARIO_PAIRS: chromium:firefox-android firefox-android:webkit android:chromium webkit:android
      run: |
        mise exec -- scripts/android-load.sh build/android-load.txt &
        mise exec -- scripts/android-trace.sh build/android-logcat-stream.txt &
        mise exec -- node --test --test-force-exit scenarios/browsers.e2e.ts
    # whatever the cases did: a red case must not hide the rows
    - name: Platform rows on Android
      if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
      timeout-minutes: 8
      run: mise exec -- node --test --test-force-exit scenarios/platform/android.e2e.ts
    - name: Count the cases
      if: ${{ always() }}
      run: node scripts/scenario-stats.ts build/scenarios >> "$GITHUB_STEP_SUMMARY"
    - name: Capture the emulator's screen, and the runner's state
      if: ${{ failure() }}
      # bounded, as the upload after it runs only once this step ends
      timeout-minutes: 5
      run: mise exec -- scripts/android-capture.sh build
    # passing too, as a failure is read against a pass
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: scenarios-android
        path: |
          build/android-emulator*.log
          build/android-screen.png
          build/android-touches.png
          build/android-*.txt
          build/adb.*.log
          build/scenarios
  # The scenarios with Safari on the iOS Simulator: whether the app loads, keeps its data and shows each change in an
  # iPhone's Safari, and in the app on its Home Screen
  ios:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'ios' }}
    # macOS 27 with Xcode 27 and iOS 27.0, the owner's iOS; macos-latest has iOS 26 alone
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # the size the cases are written for, and the owner's, whose board shows less above its keyboard
        iphone: [iPhone 17, iPhone 13 mini]
        # in a Safari tab, and as the owner runs it, from the Home Screen
        kind: [ios-safari, ios-home]
        include:
        - iphone: iPhone 17
          slug: "17"
        - iphone: iPhone 13 mini
          slug: 13-mini
    env:
      IPHONE: ${{ matrix.iphone }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # a connection whose own port is a server's keeps that server from starting
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    # Spotlight indexes the fresh runner for its first half hour
    - name: Turn Spotlight off
      # a nicety, not a condition: mdutil once exited non-zero after saying it had done it, and took the job with it
      run: sudo mdutil -a -i off || echo "::warning::Spotlight stays on"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    # a fresh iPhone keeps the runner busy for minutes, which pass here meanwhile; the Home Screen app's clip is written
    # before this one boot, as the Home Screen reads it while booting and a second boot cost the ios-home jobs 4 minutes
    # the runner keeps CoreSimulator's own builds of the simulators' shared caches, which an obsolete tool left holding
    # only its output, and CoreSimulator points the iPhone's DYLD_SHARED_CACHE_DIR there: its logd_helper then finds no
    # cache to take the text of, and the iPhone's log shows half its lines as `<compose failure [shared UUID]>`
    - name: Leave the iPhone its runtime's own shared cache
      run: xcrun simctl runtime dyld_shared_cache remove --all
    - name: Start booting an iPhone
      run: node scripts/ios.ts --start ${{ matrix.kind == 'ios-home' && '--home' || '' }}
    # brew's php drags 17 bottles behind it after minutes updating its taps on the preview image: 9 of the job's minutes
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: "8.4"
        extensions: pdo_sqlite
        tools: none
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium
      run: npx playwright-core install chromium
    # what touches the iPhone: idb's companion, and uv for scripts/sim-hid.py's fb-idb
    - name: Install idb
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: brew install facebook/fb/idb-companion
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    - name: Boot an iPhone
      timeout-minutes: 15
      run: node scripts/ios.ts ${{ matrix.kind == 'ios-home' && '--home' || '' }}
    - name: Scenarios on iOS
      timeout-minutes: 60
      env:
        SCENARIO_PAIRS: ${{ matrix.kind }}:chromium chromium:${{ matrix.kind }}
      run: node --test --test-force-exit scenarios/browsers.e2e.ts
    - name: Count the cases
      if: ${{ always() }}
      run: node scripts/scenario-stats.ts build/scenarios >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: scenarios-${{ matrix.kind }}-${{ matrix.slug }}
        path: build/scenarios
        if-no-files-found: ignore
  feel:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'measures' }}
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # the reference too
        fetch-depth: 0
    # a connection whose own port is a server's keeps that server from starting
    # Spotlight indexes the fresh runner and every build for its first half hour, which would count in what is measured
    - name: Turn Spotlight off
      # a nicety, not a condition: mdutil once exited non-zero after saying it had done it, and took the job with it
      run: sudo mdutil -a -i off || echo "::warning::Spotlight stays on"
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
    - name: Install PHP
      run: command -v php || brew install php
    - name: Install the web toolchain and the relay, this commit's and the reference's
      run: |
        git worktree add "$RUNNER_TEMP/ref" "$(cat scripts/baselines/bench-ref)"
        for dir in . "$RUNNER_TEMP/ref"; do
          npm ci --prefix "$dir"
          npm ci --prefix "$dir/relay"
        done
    # Playwright's CDN drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium, WebKit and Firefox
      run: npx playwright-core install chromium webkit firefox
    # over the relay only: GitHub's macOS runners open no WebRTC channel; in turns, so that what slows the runner for a
    # while slows both alike
    - name: Measure this commit and the reference
      run: |
        set -o pipefail
        mkdir -p build
        for _ in $(seq 10); do
          node scripts/feel.ts --runs 1 --app "$RUNNER_TEMP/ref" | tee -a build/feel-ref.txt
          node scripts/feel.ts --runs 1 | tee -a build/feel.txt
        done
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: feel
        # and what the relay, the server and the browsers said
        path: |
          build/feel.txt
          build/feel-ref.txt
          build/feel-*.log
    - name: Compare with the reference
      run: node scripts/gate.ts build/feel.txt build/feel-ref.txt
  # this commit's Release build against the reference's in scripts/baselines/bench-ref, on the same runner and in turns:
  # one runner measured zoom 4 times slower than the next, which no baseline from other runners could allow for
  bench:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'measures' }}
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # the reference too
        fetch-depth: 0
    # Spotlight indexes the fresh runner and every build for its first half hour, which would count in what is measured
    - name: Turn Spotlight off
      # a nicety, not a condition: mdutil once exited non-zero after saying it had done it, and took the job with it
      run: sudo mdutil -a -i off || echo "::warning::Spotlight stays on"
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
    - name: Build this commit and the reference
      run: |
        git worktree add "$RUNNER_TEMP/ref" "$(cat scripts/baselines/bench-ref)"
        # mise trusts this checkout's config, not the reference's
        xcodegen=$(mise which xcodegen)
        for dir in . "$RUNNER_TEMP/ref"; do
          (
            cd "$dir"
            "$xcodegen" generate
            xcodebuild \
              -project Breezy.xcodeproj \
              -scheme Breezy \
              -configuration Release \
              -derivedDataPath build \
              build
          )
        done
    - name: Measure
      run: |
        printf '{"format": 1, "cards": [], "lanes": []}' > build/empty.breezy
        python3 scripts/make-stress-board.py build/stress.breezy
        # in turns, so that what slows the runner for a while slows both alike
        for _ in $(seq 10); do
          BENCH_BUILD="$RUNNER_TEMP/ref/build" BENCH_OUT=build/bench-ref.jsonl scripts/bench.sh ref 1 build/empty.breezy build/stress.breezy
          scripts/bench.sh nightly 1 build/empty.breezy build/stress.breezy
        done
        python3 scripts/bench-summary.py
        python3 scripts/bench-summary.py build/bench-ref.jsonl
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bench
        path: build/bench*.jsonl
    - name: Compare with the reference
      run: node scripts/gate.ts build/bench.jsonl build/bench-ref.jsonl
  # quality goal 2c: this commit's launch on a phone's CPU against bench-ref's, the Mac's reference too, in turns on the same runner, and at
  # most 1.5 s from a launch to a drawn board; then the measure's plant, a launch that must come out worse
  launch:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'measures' }}
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # the reference too
        fetch-depth: 0
    - name: Turn Spotlight off
      # a nicety, not a condition: mdutil once exited non-zero after saying it had done it, and took the job with it
      run: sudo mdutil -a -i off || echo "::warning::Spotlight stays on"
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Install the web toolchain
      run: npm ci
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium
      run: npx playwright-core install chromium
    - name: Build the reference
      run: |
        git worktree add "$RUNNER_TEMP/ref" "$(cat scripts/baselines/bench-ref)"
        cd "$RUNNER_TEMP/ref"
        npm ci
        scripts/build-site.sh "$RUNNER_TEMP/ref-site" ref
    - name: Measure and compare with the reference
      run: node scripts/launch.ts --ref "$RUNNER_TEMP/ref-site"
    # what the recorder costs: this build against itself recording nothing, in turns
    - name: Measure against this build without its recorder
      if: ${{ !cancelled() }}
      run: node scripts/launch.ts --ref-without-recorder
    - name: Plants
      if: ${{ !cancelled() }}
      timeout-minutes: 15
      run: node scripts/plants.ts --level L7
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: plants-L7
        path: build/plants
        if-no-files-found: ignore
  # New seeds every night, with the network profile and the mix of web and Swift devices in turn: Main fuzzes seeds 1–10
  # of one mix only. A failing seed's trace and the smallest one that still fails are in the fuzz artifact; replay one
  # with node scripts/fuzz.ts --replay FILE.
  fuzz:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'measures' }}
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
    - name: Install PHP
      run: command -v php || brew install php
    - name: Install the relay
      run: npm ci --prefix relay
    - name: Build breezy-sim
      run: swift build --package-path BreezyKit --product breezy-sim
    - name: Fuzz
      run: |
        profiles=(mixed lan office train tether blocked-ws)
        mixes=("2 2" "3 1" "1 3" "4 0" "0 4")
        day=$(( $(date -u +%s) / 86400 ))
        profile=${profiles[$(( day % ${#profiles[@]} ))]}
        read -r web swift <<< "${mixes[$(( day / ${#profiles[@]} % ${#mixes[@]} ))]}"
        # past Main's seeds, and none twice in years
        first=$(( 11 + day % 10000 * 120 ))
        echo "::notice::seeds $first-$(( first + 119 )), profile $profile, $web web and $swift Swift devices"
        node scripts/fuzz.ts --seeds "$first-$(( first + 119 ))" --profile "$profile" --web "$web" --swift "$swift" --shrink
    # steps drawn on both cores, past Main's seeds 1–20; a failure names the fewest steps that still part them
    - name: Parity
      if: ${{ !cancelled() }}
      run: |
        day=$(( $(date -u +%s) / 86400 ))
        first=$(( 21 + day % 10000 * 500 ))
        echo "::notice::parity seeds $first-$(( first + 499 ))"
        PARITY_SEEDS="$first:500" node --test scenarios/parity.test.ts
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ failure() }}
      with:
        name: fuzz
        path: build/fuzz
  # one place to read the night: the cases' failure rates across every device, each job's result, and, for main's nights
  # alone, an issue labelled nightly opened on the first red night and told of each night after, until someone closes it
  # with the fix. A part left out by `only` is skipped, not red
  summary:
    needs:
    - desktop
    - android
    - ios
    - feel
    - bench
    - launch
    - fuzz
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      # the night before's runs, to hold this one to
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: scenarios-*
        path: build/nightly
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: hub-fakes
        path: build/hub-nightly
      continue-on-error: true
    # the scheduled night before this one, whatever its colour: only cases that passed on both are held together
    - name: The night before's runs
      continue-on-error: true
      timeout-minutes: 5
      env:
        GH_TOKEN: ${{ github.token }}
        THIS_RUN: ${{ github.run_id }}
      run: |
        id=$(gh run list --workflow nightly.yaml --branch main --event schedule --status completed --limit 2 --json databaseId --jq "[.[] | select(.databaseId != $THIS_RUN)][0].databaseId")
        if [ -n "$id" ] && [ "$id" != null ]; then gh run download "$id" --pattern 'scenarios-*' --dir build/night-before; fi
    - name: Sum up the night
      env:
        RESULTS: ${{ toJSON(needs) }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -d build/nightly ]; then node scripts/scenario-stats.ts build/nightly >> "$GITHUB_STEP_SUMMARY"; fi
        # each failure beside a run of its case that passed: where their recordings part
        if [ -d build/nightly ]; then node scripts/controls.ts build/nightly >> "$GITHUB_STEP_SUMMARY"; fi
        # the hub's fakes against the real devices they stand for, a report while it proves itself
        if [ -d build/hub-nightly ]; then node scripts/parity.ts build/nightly build/hub-nightly >> "$GITHUB_STEP_SUMMARY"; fi
        # what each device did a different number of times than the night before, a report while it proves itself
        if [ -d build/night-before ]; then node scripts/nights.ts build/night-before build/nightly >> "$GITHUB_STEP_SUMMARY"; fi
        {
          echo
          echo "| Job | Result |"
          echo "|---|---|"
          jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
        } >> "$GITHUB_STEP_SUMMARY"
        red=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<< "$RESULTS")
        if [ "$GITHUB_REF" = "refs/heads/main" ]; then
          open=$(gh issue list --label nightly --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$red" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "Red again on $(date -u +%F): $red — $RUN_URL"
            else
              gh issue create --label nightly --title "Nightly red since $(date -u +%F)" --body "Red: $red — $RUN_URL"
            fi
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body "Green on $(date -u +%F): $RUN_URL"
          fi
        fi
        if [ -n "$red" ]; then
          echo "red: $red"
          exit 1
        fi
