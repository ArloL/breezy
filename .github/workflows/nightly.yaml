name: Nightly

# The measured network feel and the Mac's performance journal, each against baselines in scripts/baselines/ that runners
# recorded: a run fails when a measure's 95 % CI lies wholly above every baseline's. One runner can measure 40 % slower
# than the next, so the baselines are several runs' artifacts; one that fails on such a runner joins them. Pull requests
# that change what is measured or the baselines run it too.
on:
  schedule:
  - cron: "23 2 * * *"
  workflow_dispatch:
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/nightly.yaml
    - scripts/baselines/**
    - scripts/gate.ts
    - scripts/feel.ts
    - scenarios/**
    - scripts/android.ts
    - mise.android.toml
    - Breezy/Support/Control.swift
    - scripts/bench.sh
    - Breezy/Support/Bench.swift
permissions: {}

jobs:
  feel:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
    - name: Install PHP
      run: command -v php || brew install php
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    # Playwright's CDN drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium, WebKit and Firefox
      run: npx playwright-core install chromium webkit firefox
    # over the relay only: GitHub's macOS runners open no WebRTC channel
    - name: Measure
      run: |
        set -o pipefail
        mkdir -p build
        node scripts/feel.ts | tee build/feel.txt
        tail -n 1 build/feel.txt > build/feel.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: feel
        path: build/feel.json
    - name: Compare with the baseline
      run: |
        shopt -s nullglob
        baselines=(scripts/baselines/feel/*.json)
        if [ ${#baselines[@]} -eq 0 ]; then
          echo "::notice::No baselines in scripts/baselines/feel/: this run's artifact can be one"
          exit 0
        fi
        node scripts/gate.ts build/feel.json "${baselines[@]}"
    # the Mac app the scenarios drive through -BreezyControl
    - name: Build the Mac app
      run: |
        xcodegen generate
        xcodebuild -project Breezy.xcodeproj -scheme Breezy -configuration Debug -derivedDataPath build build
    - name: Scenarios on real devices
      run: node --test scenarios/browsers.e2e.ts
  # GitHub's macOS runners cannot run the emulator, Linux's have KVM; so the Mac → Android pair stays local
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MISE_ENV: android
      # no Linux build
      MISE_DISABLE_TOOLS: xcodegen
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
    - name: Install zsh, PHP's SQLite and KVM access
      run: |
        sudo apt-get update
        sudo apt-get install --yes zsh php-cli php-sqlite3
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    # Playwright's CDN drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium
      run: npx playwright-core install --with-deps chromium
    # the emulator and its system image, which scripts/android.ts installs: Google's server drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise/installs/android-sdk
        key: android-sdk-${{ runner.os }}-${{ hashFiles('mise.android.toml', 'scripts/android.ts') }}
    - name: Boot the emulator
      timeout-minutes: 8
      run: mise exec -- node scripts/android.ts
    - name: Scenarios on Android
      timeout-minutes: 8
      run: mise exec -- node --test --test-force-exit --test-name-pattern android scenarios/browsers.e2e.ts
    - name: Capture the emulator's screen
      if: ${{ failure() }}
      # the emulator by its console's serial: adb counts adbd over TCP on 127.0.0.1 as one too
      run: |
        serial=$(mise exec -- adb devices | grep -o -m1 "^emulator-[0-9]*")
        mise exec -- adb -s "$serial" exec-out screencap -p > build/android-screen.png || true
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ failure() }}
      with:
        name: android-emulator
        path: |
          build/android-emulator.log
          build/android-screen.png
          build/android-touches.png
  bench:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
    - name: Generate project
      run: xcodegen generate
    - name: Build
      run: |
        xcodebuild \
          -project Breezy.xcodeproj \
          -scheme Breezy \
          -configuration Release \
          -derivedDataPath build \
          build
    - name: Measure
      run: |
        printf '{"format": 1, "cards": [], "lanes": []}' > build/empty.breezy
        python3 scripts/make-stress-board.py build/stress.breezy
        scripts/bench.sh nightly 10 build/empty.breezy build/stress.breezy
        python3 scripts/bench-summary.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bench
        path: build/bench.jsonl
    - name: Compare with the baseline
      run: |
        shopt -s nullglob
        baselines=(scripts/baselines/bench/*.jsonl)
        if [ ${#baselines[@]} -eq 0 ]; then
          echo "::notice::No baselines in scripts/baselines/bench/: this run's artifact can be one"
          exit 0
        fi
        node scripts/gate.ts build/bench.jsonl "${baselines[@]}"
