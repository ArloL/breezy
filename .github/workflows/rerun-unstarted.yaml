name: Re-run jobs that never started

# GitHub cancels a job it finds no macOS runner for ("The job was not acquired by Runner of type hosted"), and the run is
# red with no step run: four times from 2026-10-28 to 2026-11-05. It is tried once more. Nothing that ran is run again into
# green: a job with a single step is left to whoever reads it.
on:
  # zizmor: ignore[dangerous-triggers] checks nothing out: only reads the run's jobs and asks for them again
  workflow_run:
    workflows: [Main, Nightly, Mutation, Plants]
    types: [completed]
permissions: {}

jobs:
  rerun:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: Ask again for the jobs that never started
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN: ${{ github.event.workflow_run.id }}
      run: |
        unstarted=$(gh api "repos/$GH_REPO/actions/runs/$RUN/attempts/1/jobs?per_page=100" | jq -r '[.jobs[] | select(.conclusion == "cancelled" and (.steps | length) == 0) | .name] | join(", ")')
        if [ -n "$unstarted" ]; then
          echo "::notice::never started: $unstarted"
          gh run rerun "$RUN" --failed
        fi
