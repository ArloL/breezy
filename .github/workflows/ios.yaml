name: iOS scenarios

# The scenarios with Safari on the iOS Simulator watching what Chromium does: whether the app loads, keeps its data and
# shows each change in an iPhone's Safari, and in the app on its Home Screen. A workflow of its own while it proves itself,
# so that it fails nothing else.
# Nightly and on dispatch; never on a pull request, whose checks are Main's alone.
on:
  schedule:
  - cron: "53 2 * * *"
  workflow_dispatch:
permissions: {}

jobs:
  ios:
    # macOS 27 with Xcode 27 and iOS 27.0, the owner's iOS; macos-latest has iOS 26 alone
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # the size the cases are written for, and the owner's, whose board shows less above its keyboard
        iphone: [iPhone 17, iPhone 13 mini]
        # in a Safari tab, and as the owner runs it, from the Home Screen
        kind: [ios-safari, ios-home]
    env:
      IPHONE: ${{ matrix.iphone }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # a connection whose own port is a server's keeps that server from starting
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    # Spotlight indexes the fresh runner for its first half hour
    - name: Turn Spotlight off
      run: sudo mdutil -a -i off
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    # a fresh iPhone keeps the runner busy for minutes, which pass here meanwhile; the Home Screen app's clip is written
    # before this one boot, as the Home Screen reads it while booting and a second boot cost the ios-home jobs 4 minutes
    - name: Start booting an iPhone
      run: node scripts/ios.ts --start ${{ matrix.kind == 'ios-home' && '--home' || '' }}
    # brew's php drags 17 bottles behind it after minutes updating its taps on the preview image: 9 of the job's minutes
    - uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
      with:
        php-version: "8.4"
        extensions: pdo_sqlite
        tools: none
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium
      run: npx playwright-core install chromium
    # what touches the iPhone: idb's companion, and uv for scripts/sim-hid.py's fb-idb
    - name: Install idb
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: brew install facebook/fb/idb-companion
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    - name: Boot an iPhone
      timeout-minutes: 15
      run: node scripts/ios.ts ${{ matrix.kind == 'ios-home' && '--home' || '' }}
    - name: Scenarios on iOS
      timeout-minutes: 60
      env:
        SCENARIO_PAIRS: ${{ matrix.kind }}:chromium chromium:${{ matrix.kind }}
      run: node --test --test-force-exit scenarios/browsers.e2e.ts
    # the real devices' plants, whatever the cases before did: a board that cannot open offline, in Chromium
    - name: Plants
      if: ${{ !cancelled() && matrix.kind == 'ios-safari' }}
      env:
        SCENARIO_PAIRS: ios-safari:chromium
      run: node scripts/plants.ts --level L6
    - name: Count the cases
      if: ${{ always() }}
      run: node scripts/scenario-stats.ts build/scenarios >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        # ios-scenarios is the iPhone 17's Safari tab's
        name: ${{ format('{0}-scenarios{1}', matrix.kind == 'ios-safari' && 'ios' || 'ios-home', matrix.iphone != 'iPhone 17' && '-13-mini' || '') }}
        path: build/scenarios
        if-no-files-found: ignore
