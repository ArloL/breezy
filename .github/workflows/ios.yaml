name: iOS scenarios

# The scenarios with Safari on the iOS Simulator watching what Chromium does: whether the app loads, keeps its data and
# shows each change in an iPhone's Safari. A workflow of its own while it proves itself, so that it fails nothing else.
# Nightly, on dispatch, and on pull requests that change how it runs.
on:
  schedule:
  - cron: "53 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
    - .github/workflows/ios.yaml
    - scenarios/ios.ts
    - scenarios/agent.ts
    - scripts/ios.ts
    - scripts/sim-hid.py
permissions: {}

jobs:
  ios:
    # macOS 27 with Xcode 27 and iOS 27.0, the owner's iOS; macos-latest has iOS 26 alone
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # a connection whose own port is a server's keeps that server from starting
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    # Spotlight indexes the fresh runner for its first half hour
    - name: Turn Spotlight off
      run: sudo mdutil -a -i off
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    # a fresh iPhone keeps the runner busy for minutes, which pass here meanwhile
    - name: Start booting an iPhone
      run: node scripts/ios.ts --start
    - name: Install PHP
      run: command -v php || brew install php
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium
      run: npx playwright-core install chromium
    # what touches the iPhone: idb's companion, and uv for scripts/sim-hid.py's fb-idb
    - name: Install idb
      run: brew install facebook/fb/idb-companion
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    - name: Boot an iPhone
      timeout-minutes: 15
      run: node scripts/ios.ts
    - name: Scenarios with Safari on iOS
      timeout-minutes: 60
      env:
        SCENARIO_PAIRS: ios-safari:chromium chromium:ios-safari
      run: node --test --test-force-exit scenarios/browsers.e2e.ts
    - name: Count the cases
      if: ${{ always() }}
      run: node scripts/scenario-stats.ts build/scenarios >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: ios-scenarios
        path: build/scenarios
        if-no-files-found: ignore
