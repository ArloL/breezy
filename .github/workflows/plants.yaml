name: Plants

# Each plant in TESTING.md's matrix put back, and each level that claims its class required to fail with it and pass
# without it (scripts/plants.ts): the levels that run in Node here; the real devices' (L6) and the launch measure's (L7)
# in Nightly.
on:
  schedule:
  - cron: "11 5 * * 1"
  workflow_dispatch:
permissions: {}

jobs:
  plants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # a connection whose own port is a server's keeps that server from starting
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
    # the deploy check builds the site, with tsc
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    - name: Build breezy-sim
      run: swift build --package-path BreezyKit --product breezy-sim
    - name: Plants
      run: node scripts/plants.ts --level L1,L2,L3,L4,L8
    - if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        if-no-files-found: ignore
        name: plants
        path: build/plants

  report:
    needs:
    - plants
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
    - name: Keep an issue open while it is red
      env:
        RESULTS: ${{ toJSON(needs) }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        red=$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")' <<< "$RESULTS")
        open=$(gh issue list --label plants --state open --limit 1 --json number --jq '.[0].number // empty')
        if [ -n "$red" ]; then
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Red again on $(date -u +%F): $red — $RUN_URL"
          else
            gh label create plants --force
            gh issue create --label plants --title "Plants red since $(date -u +%F)" --body "Red: $red — $RUN_URL"
          fi
        elif [ -n "$open" ]; then
          gh issue close "$open" --comment "Green on $(date -u +%F): $RUN_URL"
        fi
