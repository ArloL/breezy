name: Chores

on:
  workflow_dispatch:
  repository_dispatch:
    types:
    - chores
  schedule:
  - cron: "46 8 17 * *"
permissions: {}
concurrency: chores

jobs:
  debug:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJSON(github) }}
      run: echo "$GITHUB_CONTEXT"
    - name: Dump job context
      env:
        JOB_CONTEXT: ${{ toJSON(job) }}
      run: echo "$JOB_CONTEXT"
    - name: Dump steps context
      env:
        STEPS_CONTEXT: ${{ toJSON(steps) }}
      run: echo "$STEPS_CONTEXT"
    - name: Dump runner context
      env:
        RUNNER_CONTEXT: ${{ toJSON(runner) }}
      run: echo "$RUNNER_CONTEXT"
    - name: Dump strategy context
      env:
        STRATEGY_CONTEXT: ${{ toJSON(strategy) }}
      run: echo "$STRATEGY_CONTEXT"
    - name: Dump matrix context
      env:
        MATRIX_CONTEXT: ${{ toJSON(matrix) }}
      run: echo "$MATRIX_CONTEXT"
    - name: Dump environment variables
      run: set
  chores:
    name: Chores
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Chores
      run: |
        /bin/bash -c "$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://raw.githubusercontent.com/ArloL/chorito/HEAD/run-latest.sh)"
        git diff
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        body: "Automated changes by [chorito](https://github.com/ArloL/chorito)"
        branch: chorito/patch
        commit-message: "chore: automated changes by chorito"
        title: "chore: automated changes by chorito"

  report:
    needs: [chores]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
    - name: Keep an issue open while it is red
      env:
        RESULTS: ${{ toJSON(needs) }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        red=$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")' <<< "$RESULTS")
        open=$(gh issue list --label chores --state open --limit 1 --json number --jq '.[0].number // empty')
        if [ -n "$red" ]; then
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Red again on $(date -u +%F): $red — $RUN_URL"
          else
            gh label create chores --force
            gh issue create --label chores --title "Chores red since $(date -u +%F)" --body "Red: $red — $RUN_URL"
          fi
        elif [ -n "$open" ]; then
          gh issue close "$open" --comment "Green on $(date -u +%F): $RUN_URL"
        fi
