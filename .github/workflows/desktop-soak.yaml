name: Desktop soak

# The scenarios on real devices but Android's, Chromium, WebKit, Firefox and the Debug Mac app, over and over on many
# macOS runners, to measure how often they fail: Main retries a failing case once, which hides a rare flake there. A
# failing case's timeline.txt in build/scenarios has its steps, pages and sync: read it before anything else. Nightly,
# for the flake budget (scripts/flake-budget.ts) to count, or dispatch it.
on:
  schedule:
  - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      runners:
        description: macOS runners
        default: "10"
      runs:
        description: Runs of the scenarios on each
        default: "4"
permissions: {}

jobs:
  shards:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
    - id: shards
      env:
        RUNNERS: ${{ inputs.runners || '10' }}
      run: echo "shards=$(seq --separator=, 1 "$RUNNERS" | sed 's/.*/[&]/')" >> "$GITHUB_OUTPUT"
  desktop:
    needs: shards
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.shards) }}
    permissions:
      contents: read
    env:
      RUNS: ${{ inputs.runs || '4' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # a connection whose own port is a server's keeps that server from starting
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    # Spotlight indexes the fresh runner and every build for its first half hour, which kept the load at 18 on 3 CPUs
    # while Firefox ran every timer 100 ms late
    - name: Turn Spotlight off
      run: sudo mdutil -a -i off
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
    - name: Install PHP
      run: command -v php || brew install php
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium, WebKit and Firefox
      run: npx playwright-core install chromium webkit firefox
    - name: Build the Mac app
      run: |
        xcodegen generate
        xcodebuild -project Breezy.xcodeproj -scheme Breezy -configuration Debug -derivedDataPath build build
    - name: The scenarios, over and over
      run: |
        mkdir -p build/soak
        # what the runner is busy with, every 10 s: top's second sample, as its first has no CPU shares yet
        (while sleep 10; do date -u +%T; uptime; top -l 2 -s 1 -n 8 -o cpu -stats pid,command,cpu,mem | tail -n 9; done > build/soak/load.txt 2>&1) &
        failed=0
        for i in $(seq 1 "$RUNS"); do
          echo "::group::run $i"
          node --test --test-force-exit --test-skip-pattern android scenarios/browsers.e2e.ts > "build/soak/run-$i.txt" 2>&1 || {
            failed=1
            echo "::error::run $i failed"
          }
          grep -E '^(✔|✖|ℹ (pass|fail))' "build/soak/run-$i.txt" || true
          echo "::endgroup::"
        done
        exit $failed
    - name: Keep each case's record
      if: ${{ always() }}
      run: cp -R build/scenarios build/soak/ 2>/dev/null || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: desktop-soak-${{ matrix.shard }}
        path: build/soak
  # every shard's case runs counted together: failure rates by case, pair, step and error, and the slowest
  summary:
    needs: desktop
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: desktop-soak-*
        path: build/soaks
    - run: node scripts/scenario-stats.ts build/soaks >> "$GITHUB_STEP_SUMMARY"
