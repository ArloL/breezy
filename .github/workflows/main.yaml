name: Main

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: "37 9 23 * *"
permissions: {}
env:
  ARTIFACT: breezy

jobs:
  debug:
    runs-on: ubuntu-slim
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJSON(github) }}
      run: echo "$GITHUB_CONTEXT"
    - name: Dump job context
      env:
        JOB_CONTEXT: ${{ toJSON(job) }}
      run: echo "$JOB_CONTEXT"
    - name: Dump steps context
      env:
        STEPS_CONTEXT: ${{ toJSON(steps) }}
      run: echo "$STEPS_CONTEXT"
    - name: Dump runner context
      env:
        RUNNER_CONTEXT: ${{ toJSON(runner) }}
      run: echo "$RUNNER_CONTEXT"
    - name: Dump strategy context
      env:
        STRATEGY_CONTEXT: ${{ toJSON(strategy) }}
      run: echo "$STRATEGY_CONTEXT"
    - name: Dump matrix context
      env:
        MATRIX_CONTEXT: ${{ toJSON(matrix) }}
      run: echo "$MATRIX_CONTEXT"
    - name: Dump environment variables
      run: set
  version:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true
    - name: Bump version and push tag
      id: tag
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: ArloL/calver-tag-action@825bf3b80af6de7609a7915750b328a2f9884710 # v2609.0.104
    - name: Make sure build did not change anything
      run: git diff --exit-code
  macos:
    needs: version
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
    - name: Generate project
      run: xcodegen generate
    - name: Test BreezyKit
      run: swift test --package-path BreezyKit
    # without this, XCUITest times out waiting for an authorization prompt nobody can answer
    - name: Enable automation mode
      run: sudo automationmodetool enable-automationmode-without-authentication
    - name: Test the app
      run: |
        xcodebuild \
          -project Breezy.xcodeproj \
          -scheme Breezy \
          -destination platform=macOS \
          -derivedDataPath build \
          test
    # Off main there is no tag, so the project's own placeholder version stays.
    # CFBundleVersion only takes dotted integers, which the CalVer tag already is.
    - name: Build
      env:
        NEW_VERSION: ${{ needs.version.outputs.new_version }}
      run: |
        set -o xtrace
        VERSION_SETTINGS=()
        if [ -n "${NEW_VERSION}" ]; then
          VERSION_SETTINGS=(
            MARKETING_VERSION="${NEW_VERSION}"
            CURRENT_PROJECT_VERSION="${NEW_VERSION}"
            BREEZY_UPDATE_FEED=https://github.com/ArloL/breezy/releases/latest/download/appcast.xml
          )
        fi
        xcodebuild \
          -project Breezy.xcodeproj \
          -scheme Breezy \
          -configuration Release \
          -derivedDataPath build \
          "${VERSION_SETTINGS[@]}" \
          build
    # ditto rather than zip: it keeps the bundle's symlinks and extended
    # attributes, which the ad-hoc code signature depends on.
    - name: Package
      run: |
        mkdir artifacts
        ditto -c -k --keepParent build/Build/Products/Release/Breezy.app "artifacts/${ARTIFACT}-macos.zip"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.ARTIFACT }}-${{ github.job }}
        path: artifacts
    # for the appcast job: this one runs on pull requests too, so it must not hold the signing key
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ needs.version.outputs.new_version != '' }}
      with:
        name: sparkle-tools
        path: build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast
    - name: Make sure build did not change anything
      run: git diff --exit-code
  # the server and the relay under their tests, then web and Swift devices fuzzed against both: fixed seeds, so a failure
  # replays with the same command. direct-e2e.ts stays local: GitHub's macOS runners open no WebRTC channel
  sync:
    needs: version
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
    - name: Install PHP
      run: command -v php || brew install php
    - name: Test the server
      run: server/test.sh
    - name: Test the relay
      run: |
        npm ci --prefix relay
        relay/test.sh
    - name: Build breezy-sim
      run: swift build --package-path BreezyKit --product breezy-sim
    - name: Test the fuzzer
      run: node --test scripts/fuzz/test/*.test.ts
    - name: Scenarios
      run: node --test scenarios/*.test.ts
    - name: Fuzz convergence
      run: node scripts/fuzz.ts --seeds 1-10 --steps 200
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ failure() }}
      with:
        name: fuzz
        path: build/fuzz
  web:
    needs: version
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Install the web toolchain
      run: npm ci
    - name: Check types
      run: npm run check
    - name: Test the touch prototype
      run: npm test
    - name: Test the relay's hold rules
      run: node --test relay/test/holds.test.mjs
    # Off main there is no tag, so the page's own placeholder version stays.
    - name: Build the site
      env:
        NEW_VERSION: ${{ needs.version.outputs.new_version }}
      run: scripts/build-site.sh _site "$NEW_VERSION"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: site
        path: _site
        include-hidden-files: true
    - name: Make sure build did not change anything
      run: git diff --exit-code
  # The scenarios on real devices against sync.php and the relay: the web app in Chromium, WebKit and Firefox and the Debug
  # Mac app, which they drive through -BreezyControl. Android's pairs run in the android job; the Mac → Android pair stays
  # local, as GitHub's macOS runners cannot run the emulator and Linux's have no Mac app.
  scenarios:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
    - name: Install PHP
      run: command -v php || brew install php
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    # Playwright's CDN drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium, WebKit and Firefox
      run: npx playwright-core install chromium webkit firefox
    - name: Platform rows and trace replays
      run: node --test --test-force-exit scenarios/platform/*.test.ts
    - name: Build the Mac app
      run: |
        xcodegen generate
        xcodebuild -project Breezy.xcodeproj -scheme Breezy -configuration Debug -derivedDataPath build build
    - name: Scenarios on real devices
      timeout-minutes: 30
      # a case that fails gets a second run: one that then passes warns, its logs kept, rather than block a merge
      env:
        SCENARIO_RUNS: "2"
      # a handle left open once kept node from exiting after the last case, until the job timed out
      run: node --test --test-force-exit scenarios/browsers.e2e.ts
    - name: Warn of the cases that failed once
      if: ${{ always() }}
      run: if [ -f build/scenarios/flaky.txt ]; then sed 's/^/::warning title=Flaky scenario::/' build/scenarios/flaky.txt; fi
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ failure() || hashFiles('build/scenarios/flaky.txt') != '' }}
      with:
        name: scenarios
        path: |
          build/scenarios
          build/touches
        if-no-files-found: ignore
  # The scenarios' Android pairs on an emulator: GitHub's Linux runners have KVM, its macOS runners cannot run one
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MISE_ENV: android
      # no Linux build
      MISE_DISABLE_TOOLS: xcodegen
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
    - name: Install zsh, PHP's SQLite and KVM access
      run: |
        # a mirror mid-sync fails a download now and then
        sudo apt-get --option Acquire::Retries=5 update
        sudo apt-get --option Acquire::Retries=5 install --yes zsh php-cli php-sqlite3
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    # Playwright's CDN drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium
      run: npx playwright-core install --with-deps chromium
    # the emulator and its system image, which scripts/android.ts installs: Google's server drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise/installs/android-sdk
        key: android-sdk-${{ runner.os }}-${{ hashFiles('mise.android.toml', 'scripts/android.ts') }}
        # a changed script starts from the SDK before it and downloads only what is new
        restore-keys: android-sdk-${{ runner.os }}-
    - name: Boot the emulator
      timeout-minutes: 8
      run: mise exec -- node scripts/android.ts
    - name: Scenarios on Android
      timeout-minutes: 10
      env:
        SCENARIO_RUNS: "2"
      run: mise exec -- node --test --test-force-exit --test-name-pattern android scenarios/browsers.e2e.ts
    - name: Platform rows on Android
      timeout-minutes: 8
      run: mise exec -- node --test --test-force-exit scenarios/platform/android.e2e.ts
    - name: Warn of the cases that failed once
      if: ${{ always() }}
      run: if [ -f build/scenarios/flaky.txt ]; then sed 's/^/::warning title=Flaky scenario::/' build/scenarios/flaky.txt; fi
    - name: Capture the emulator's screen, and the runner's state
      if: ${{ failure() }}
      # the emulator by its console's serial: adb counts adbd over TCP on 127.0.0.1 as one too; none once it has died
      run: |
        serial=$(mise exec -- adb devices | grep -o -m1 "^emulator-[0-9]*") || true
        if [ -n "$serial" ]; then mise exec -- adb -s "$serial" exec-out screencap -p > build/android-screen.png || true; fi
        { pgrep -a qemu || echo "no emulator running"; free -m; sudo dmesg | tail -n 50; } > build/android-host.txt 2>&1
        cp /tmp/adb.*.log build/ 2>/dev/null || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ failure() || hashFiles('build/scenarios/flaky.txt') != '' }}
      with:
        name: android-emulator
        path: |
          build/android-emulator.log
          build/android-screen.png
          build/android-touches.png
          build/android-host.txt
          build/adb.*.log
          build/touches
          build/scenarios
  # Sparkle reads the feed from the latest release, so each release carries its own; only main
  # can read the update-signing environment's key
  appcast:
    needs:
    - version
    - macos
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    environment: update-signing
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ env.ARTIFACT }}-macos
        path: archives
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sparkle-tools
        path: sparkle
    # artifacts lose the executable bit
    - name: Sign the update feed
      env:
        NEW_VERSION: ${{ needs.version.outputs.new_version }}
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      run: |
        chmod +x sparkle/generate_appcast
        sparkle/generate_appcast \
          --ed-key-file - \
          --download-url-prefix "https://github.com/ArloL/breezy/releases/download/v${NEW_VERSION}/" \
          archives <<< "${SPARKLE_PRIVATE_KEY}"
        mkdir feed
        mv archives/appcast.xml feed/
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.ARTIFACT }}-${{ github.job }}
        path: feed
  release:
    needs:
    - version
    - macos
    - appcast
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # the release's own artifacts only, not the web job's site
    - name: Download the release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: ./target
        pattern: ${{ env.ARTIFACT }}-*
        merge-multiple: true
    - name: Attest the release assets
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: target/*
    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEW_VERSION: ${{ needs.version.outputs.new_version }}
      run: |
        gh release create "v${NEW_VERSION}" \
          --title "Release ${NEW_VERSION}" \
          ./target/*
    - name: Make sure build did not change anything
      run: git diff --exit-code
  # the web app and the sync server on breezy.k5d.de, over FTPS; the production environment
  # holds the hosting and database credentials
  deploy:
    needs:
    - web
    - release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    environment:
      name: production
      url: https://breezy.k5d.de/
    # one deployment at a time, and never cut short
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: site
        path: _site
    - name: Upload
      env:
        BREEZY_WEB_USER: ${{ secrets.BREEZY_WEB_USER }}
        BREEZY_WEB_PASSWORD: ${{ secrets.BREEZY_WEB_PASSWORD }}
        BREEZY_DATABASE_USER: ${{ secrets.BREEZY_DATABASE_USER }}
        BREEZY_DATABASE_PASSWORD: ${{ secrets.BREEZY_DATABASE_PASSWORD }}
      run: scripts/deploy.py _site
    - name: Make sure build did not change anything
      run: git diff --exit-code
  # the relay on Cloudflare, once the production environment holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; a
  # relay older than the apps still serves them, so it may go after the site
  relay:
    needs:
    - web
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    environment: production
    concurrency:
      group: relay
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Deploy the relay
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
          echo "::warning::The production environment has no CLOUDFLARE_API_TOKEN, so the relay was not deployed"
          exit 0
        fi
        npm ci --prefix relay
        npm --prefix relay run deploy
  required-status-check:
    name: main.required-status-check
    needs:
    - macos
    - web
    - scenarios
    - android
    # GitHub Actions skips this job when any of the dependents fail. And skips
    # are considered success in their weird logic. So we always run it and fail
    # ourselves if necessary
    if: always()
    runs-on: ubuntu-slim
    steps:
    - run: echo "Use this job as the required status check of this workflow"
    - name: Check that all jobs were successful
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS" | jq --exit-status 'all(.result == "success")' || exit 1
