name: Main

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: "37 9 23 * *"
permissions: {}
env:
  ARTIFACT: breezy

jobs:
  debug:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJSON(github) }}
      run: echo "$GITHUB_CONTEXT"
    - name: Dump job context
      env:
        JOB_CONTEXT: ${{ toJSON(job) }}
      run: echo "$JOB_CONTEXT"
    - name: Dump steps context
      env:
        STEPS_CONTEXT: ${{ toJSON(steps) }}
      run: echo "$STEPS_CONTEXT"
    - name: Dump runner context
      env:
        RUNNER_CONTEXT: ${{ toJSON(runner) }}
      run: echo "$RUNNER_CONTEXT"
    - name: Dump strategy context
      env:
        STRATEGY_CONTEXT: ${{ toJSON(strategy) }}
      run: echo "$STRATEGY_CONTEXT"
    - name: Dump matrix context
      env:
        MATRIX_CONTEXT: ${{ toJSON(matrix) }}
      run: echo "$MATRIX_CONTEXT"
    - name: Dump environment variables
      run: set
  version:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.output.outputs.new_version }}
      build_timestamp: ${{ steps.output.outputs.build_timestamp }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true
    - name: Bump version and push tag
      id: tag
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: ArloL/calver-tag-action@5b7bec3f9f521a306f19c205a94353f427c7b9f0 # v2610.0.107
    - id: output
      env:
        NEW_VERSION: ${{ steps.tag.outputs.new_version }}
      run: |
        echo "new_version=${NEW_VERSION:-$GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
        echo "build_timestamp=$(date --iso-8601=seconds)" >> "${GITHUB_OUTPUT}"
    - name: Make sure build did not change anything
      run: git diff --exit-code
  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
    - name: Generate project
      run: xcodegen generate
    - name: Test BreezyKit
      run: swift test --package-path BreezyKit
    # without this, XCUITest times out waiting for an authorization prompt nobody can answer
    - name: Enable automation mode
      run: sudo automationmodetool enable-automationmode-without-authentication
    - name: Test the app
      run: |
        xcodebuild \
          -project Breezy.xcodeproj \
          -scheme Breezy \
          -destination platform=macOS \
          -derivedDataPath build \
          test
    # Off main there is no tag, so the project's own placeholder version stays.
    # CFBundleVersion only takes dotted integers, which the CalVer tag already is.
    - name: Build
      env:
        NEW_VERSION: ${{ needs.version.outputs.new_version }}
      run: |
        set -o xtrace
        VERSION_SETTINGS=()
        if [ -n "${NEW_VERSION}" ]; then
          VERSION_SETTINGS=(
            MARKETING_VERSION="${NEW_VERSION}"
            CURRENT_PROJECT_VERSION="${NEW_VERSION}"
            BREEZY_UPDATE_FEED=https://github.com/ArloL/breezy/releases/latest/download/appcast.xml
          )
        fi
        xcodebuild \
          -project Breezy.xcodeproj \
          -scheme Breezy \
          -configuration Release \
          -derivedDataPath build \
          "${VERSION_SETTINGS[@]}" \
          build
    # ditto rather than zip: it keeps the bundle's symlinks and extended
    # attributes, which the ad-hoc code signature depends on. Sparkle's
    # generate_appcast skipped an app failing the signature's checks; the
    # appcast job, on Linux, cannot check it
    - name: Package
      run: |
        codesign --verify --deep --strict build/Build/Products/Release/Breezy.app
        mkdir artifacts
        ditto -c -k --keepParent build/Build/Products/Release/Breezy.app "artifacts/${ARTIFACT}-macos.zip"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.ARTIFACT }}-${{ github.job }}
        path: artifacts
    - name: Make sure build did not change anything
      run: git diff --exit-code
  # the server and the relay under their tests, then web and Swift devices fuzzed against both: fixed seeds, so a failure
  # replays with the same command. direct-e2e.ts stays local: GitHub's macOS runners open no WebRTC channel. On Linux, as
  # the macOS runners run short: the runner's Swift, swift-crypto for CryptoKit, and BreezyKit's UndoManager for
  # Foundation's; the macos job still tests BreezyKit on Apple's
  sync:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # a connection whose own port is a server's keeps that server from starting
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
    # the runner links swift and swiftc alone; scenarios/simctl.test.ts reads a plist back with the toolchain's plutil
    - name: Put the Swift toolchain on PATH
      run: |
        echo "$SWIFT_PATH" >> "$GITHUB_PATH"
        PATH="$SWIFT_PATH:$PATH" command -v plutil
    - name: Test the server
      run: |
        swift --version
        server/test.sh
    - name: Test the relay
      run: |
        npm ci --prefix relay
        relay/test.sh
    - name: Build breezy-sim
      run: swift build --package-path BreezyKit --product breezy-sim
    - name: Test the fuzzer
      run: node --test scripts/fuzz/test/*.test.ts
    - name: Scenarios
      run: node --test scenarios/*.test.ts
    - name: Fuzz convergence
      run: node scripts/fuzz.ts --seeds 1-10 --steps 200
    - if: ${{ failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz
        path: build/fuzz
  web:
    needs: version
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # the escape log's test finds each row's commit
        fetch-depth: 0
        persist-credentials: false
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
    - name: Install the web toolchain
      run: npm ci
    - name: Check types
      run: npm run check
    # by its shebang, POSIX sh or bash: shellcheck refuses zsh, which the Linux runners lack
    - name: Check the shell scripts
      run: git ls-files -z '*.sh' | xargs -0 shellcheck
    - name: Test the web core and the scripts
      run: npm test
    - name: Test the relay's hold rules
      run: node --test relay/test/holds.test.mjs
    # Off main there is no tag, so the page's own placeholder version stays.
    - name: Build the site
      env:
        NEW_VERSION: ${{ needs.version.outputs.new_version }}
      run: scripts/build-site.sh _site "$NEW_VERSION"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        include-hidden-files: true
        name: site
        path: _site
    - name: Make sure build did not change anything
      run: git diff --exit-code
  # The platform replays in Chromium, WebKit and Firefox, and the smoke cases (scenarios/smoke.ts) on real devices against
  # sync.php and the relay: the web app in Chromium with the Debug Mac app watching, driven through -BreezyControl, each
  # case run once. The gate's share of the real devices; every case on every pair runs nightly
  desktop:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # a connection whose own port is a server's keeps that server from starting
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    # Spotlight indexes the fresh runner and every build for its first half hour, which kept the load at 18 on 3 CPUs
    # while Firefox ran every timer 100 ms late
    - name: Turn Spotlight off
      # a nicety, not a condition: mdutil once exited non-zero after saying it had done it
      run: sudo mdutil -a -i off || echo "::warning::Spotlight stays on"
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
    - name: Install PHP
      run: command -v php || brew install php
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    # Playwright's CDN drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        path: ~/Library/Caches/ms-playwright
    - name: Install Chromium, WebKit and Firefox
      run: npx playwright-core install chromium webkit firefox
    - name: Platform rows and trace replays
      run: node --test --test-force-exit scenarios/platform/*.test.ts
    - name: Build the Mac app
      run: |
        xcodegen generate
        xcodebuild -project Breezy.xcodeproj -scheme Breezy -configuration Debug -derivedDataPath build build
    - name: Smoke cases on real devices
      timeout-minutes: 8
      env:
        SCENARIO_SMOKE: '1'
        SCENARIO_PAIRS: chromium:mac
      # a handle left open once kept node from exiting after the last case, until the job timed out
      run: node --test --test-force-exit scenarios/browsers.e2e.ts
    - name: Count the cases
      if: ${{ always() }}
      run: node scripts/scenario-stats.ts build/scenarios | tee -a "$GITHUB_STEP_SUMMARY"
    # passing too, as a failure is read against a pass
    - if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        if-no-files-found: ignore
        name: scenarios
        path: build/scenarios
  # The smoke cases with Chrome on an Android emulator acting and Chromium watching: GitHub's Linux runners have KVM, its
  # macOS runners cannot run one. Every Android pair, and Firefox on the emulator, run nightly
  android:
    runs-on: ubuntu-latest
    # apt takes half again as long on some runners
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MISE_ENV: android
      # no Linux build
      MISE_DISABLE_TOOLS: xcodegen
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # a connection whose own port is a server's keeps that server from starting
    - name: Keep the servers' ports free
      run: scripts/reserve-ports.sh
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
    - name: Install PHP's SQLite and KVM access
      run: |
        # a mirror mid-sync fails a download now and then
        sudo apt-get --option Acquire::Retries=5 update
        sudo apt-get --option Acquire::Retries=5 install --yes php-cli php-sqlite3
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    # Playwright's CDN drops a download now and then
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        path: ~/.cache/ms-playwright
    # the packages Chromium needs, which Azure's Ubuntu mirror served in 9 s to one runner and in 21 min to another
    # the runner's image, which only its shell has, not the workflow's env
    - id: image
      run: echo "os=$ImageOS" >> "${GITHUB_OUTPUT}"
    # by the runner's image, newest first: a cache saved on Ubuntu 24 matched on Ubuntu 26, so the Ubuntu 26 packages were
    # never saved, and each run took 35 to 48 minutes downloading them from a slow mirror
    - id: apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: apt-playwright-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ~/apt-archives
        restore-keys: apt-playwright-${{ runner.os }}-${{ steps.image.outputs.os }}-
    # the browser the Android device pairs with
    - name: Install Chromium
      # well within the job's time, as a mirror that stalls takes it all
      timeout-minutes: 8
      run: |
        echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded
        # a stalled download again after 30 s rather than waiting out the mirror: it stalled 1 to 5 minutes at a time
        printf 'Acquire::http::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99retries
        if compgen -G ~/apt-archives/'*.deb' > /dev/null; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/; fi
        npx playwright-core install --with-deps chromium
    # what came down kept, even when the mirror ran out the step's time, so that the next run goes on from it; only when
    # something came that the cache lacked, as a key is never written twice
    - name: Keep the downloaded packages
      id: apt-new
      if: ${{ !cancelled() }}
      run: |
        mkdir -p ~/apt-archives
        count() { find ~/apt-archives -name '*.deb' | wc -l; }
        before=$(count)
        for f in /var/cache/apt/archives/*.deb; do [ -e "$f" ] && [ ! -e ~/apt-archives/"${f##*/}" ] && cp "$f" ~/apt-archives/; done
        echo "new=$(( $(count) - before ))" >> "${GITHUB_OUTPUT}"
    - if: ${{ !cancelled() && steps.apt-new.outputs.new != '0' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}
        path: ~/apt-archives
    # the emulator and its system image, which scripts/android.ts installs: Google's server drops a download now and then;
    # keyed on its list of them alone, as each change to the script saved another 3 GB
    - id: sdk-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: android-sdk-${{ runner.os }}-${{ hashFiles('mise.android.toml', 'scripts/android-sdk.ts') }}
        path: ~/.local/share/mise/installs/android-sdk
        # a changed list starts from the SDK before it and downloads only what is new
        restore-keys: android-sdk-${{ runner.os }}-
    # the emulator booted, set up and snapshotted, which loads in seconds where a cold boot took 2.6 minutes
    - id: avd-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: avd-${{ runner.os }}-${{ hashFiles('mise.android.toml', 'scripts/android-sdk.ts', 'scripts/android.ts', 'scripts/android-snapshot.sh') }}
        path: ~/avd.tar.zst
    - name: Unpack the emulator's snapshot
      if: ${{ steps.avd-cache.outputs.cache-hit == 'true' }}
      run: mise exec -- scripts/android-snapshot.sh unpack ~/avd.tar.zst
    - name: Boot the emulator
      # twice, if need be
      timeout-minutes: 16
      run: mise exec -- scripts/android-boot.sh
    # saved by main alone: a pull request's copy is its own, 3 GB each, and two of them and a stale one filled the
    # repository's 10 GB of caches; each change to scripts/android.ts saves new keys, so delete the stale ones
    - if: ${{ github.ref == 'refs/heads/main' && steps.sdk-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
        path: ~/.local/share/mise/installs/android-sdk
    # and the AVD its boot snapshotted, by main alone too, packed with the emulator stopped and booted again from it
    - name: Pack the emulator's snapshot
      if: ${{ github.ref == 'refs/heads/main' && steps.avd-cache.outputs.cache-hit != 'true' }}
      timeout-minutes: 15
      run: mise exec -- scripts/android-snapshot.sh pack ~/avd.tar.zst
    - if: ${{ github.ref == 'refs/heads/main' && steps.avd-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.avd-cache.outputs.cache-primary-key }}
        path: ~/avd.tar.zst
    - name: Smoke cases on Android
      timeout-minutes: 8
      env:
        SCENARIO_SMOKE: '1'
        SCENARIO_PAIRS: android:chromium
      run: |
        mise exec -- scripts/android-load.sh build/android-load.txt &
        mise exec -- scripts/android-trace.sh build/android-logcat-stream.txt &
        mise exec -- node --test --test-force-exit scenarios/browsers.e2e.ts
    - name: Count the cases
      if: ${{ always() }}
      run: node scripts/scenario-stats.ts build/scenarios | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Capture the emulator's screen, and the runner's state
      if: ${{ failure() }}
      # bounded, as the upload after it runs only once this step ends
      timeout-minutes: 5
      run: mise exec -- scripts/android-capture.sh build
    # passing too, as a failure is read against a pass
    - if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: android-emulator
        path: |
          build/android-emulator*.log
          build/android-screen.png
          build/android-touches.png
          build/android-*.txt
          build/adb.*.log
          build/scenarios
  # Sparkle reads the feed from the latest release, so each release carries its own; only main
  # can read the update-signing environment's key. On Linux: GitHub's macOS runners went short,
  # and this job, asking for one more after the build, lost its runner most often
  appcast:
    needs:
    - version
    - macos
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: update-signing
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ env.ARTIFACT }}-macos
        path: archives
    - name: Sign the update feed
      env:
        NEW_VERSION: ${{ needs.version.outputs.new_version }}
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      run: |
        mkdir feed
        node scripts/appcast.ts "archives/${ARTIFACT}-macos.zip" \
          "https://github.com/ArloL/breezy/releases/download/v${NEW_VERSION}/" \
          <<< "${SPARKLE_PRIVATE_KEY}" > feed/appcast.xml
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.ARTIFACT }}-${{ github.job }}
        path: feed
  release:
    needs:
    - version
    - macos
    - appcast
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # the release's own artifacts only, not the web job's site
    - name: Download the release artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        merge-multiple: true
        path: ./target
        pattern: ${{ env.ARTIFACT }}-*
    - name: Attest the release assets
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: target/*
    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEW_VERSION: ${{ needs.version.outputs.new_version }}
      run: |
        gh release create "v${NEW_VERSION}" \
          --title "Release ${NEW_VERSION}" \
          ./target/*
    - name: Make sure build did not change anything
      run: git diff --exit-code
  # the web app and the sync server on breezy.k5d.de, over FTPS; the production environment
  # holds the hosting and database credentials
  deploy:
    # the site alone: the Mac app releases on its own, and a push whose Mac side fails leaves it on the last release
    needs:
    - web
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-slim
    environment:
      name: production
      url: https://breezy.k5d.de/
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    # one deployment at a time, and never cut short
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: site
        path: _site
    - name: Upload
      env:
        BREEZY_WEB_USER: ${{ secrets.BREEZY_WEB_USER }}
        BREEZY_WEB_PASSWORD: ${{ secrets.BREEZY_WEB_PASSWORD }}
        BREEZY_DATABASE_USER: ${{ secrets.BREEZY_DATABASE_USER }}
        BREEZY_DATABASE_PASSWORD: ${{ secrets.BREEZY_DATABASE_PASSWORD }}
      run: scripts/deploy.py _site
    - name: Make sure build did not change anything
      run: git diff --exit-code
  # the relay on Cloudflare, once the production environment holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; a
  # relay older than the apps still serves them, so it may go after the site
  relay:
    needs:
    - web
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-slim
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: relay
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
    - name: Deploy the relay
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
          echo "::warning::The production environment has no CLOUDFLARE_API_TOKEN, so the relay was not deployed"
          exit 0
        fi
        npm ci --prefix relay
        npm --prefix relay run deploy
        node scripts/relay-check.ts
  required-status-check:
    name: main.required-status-check
    needs:
    - macos
    - web
    - sync
    - desktop
    - android
    # GitHub Actions skips this job when any of the dependents fail. And skips
    # are considered success in their weird logic. So we always run it and fail
    # ourselves if necessary
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
    - run: echo "Use this job as the required status check of this workflow"
    - name: Check that all jobs were successful
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS" | jq --exit-status 'all(.result == "success")' || exit 1
