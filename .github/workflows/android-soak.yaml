name: Android soak

# The Android scenarios over and over on many emulators, to measure how often they fail, with each case's touches and the
# emulator's log. Dispatch it, or push a soak/ branch for its defaults. Weekly too, as a flake once in hundreds of cases
# shows here long before Main fails of it.
# Only these runs give real failure rates: GitHub's emulators draw in software, while a Mac's has its GPU and stays quick
# however busy the Mac is. On 2026-10-14, 2,800 case runs on 112 emulators failed none, so a failure is news: read its
# touches, logcat, screen and host state. About 15–20 of this account's jobs run at once, Main's and Nightly's macOS
# jobs among them. Leftover soak/ branches are the repo owner's to delete.
on:
  schedule:
  - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      emulators:
        description: Emulators, each a runner
        default: "24"
      runs:
        description: Runs of the scenarios on each
        default: "5"
  push:
    branches:
    - soak/**
permissions: {}

jobs:
  shards:
    runs-on: ubuntu-slim
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
    - id: shards
      env:
        EMULATORS: ${{ inputs.emulators || '24' }}
      run: echo "shards=$(seq --separator=, 1 "$EMULATORS" | sed 's/.*/[&]/')" >> "$GITHUB_OUTPUT"
  android:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.shards) }}
    permissions:
      contents: read
    env:
      MISE_ENV: android
      MISE_DISABLE_TOOLS: xcodegen
      RUNS: ${{ inputs.runs || '5' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
    - name: Install zsh, PHP's SQLite and KVM access
      run: |
        # a mirror mid-sync fails a download now and then
        sudo apt-get --option Acquire::Retries=5 update
        sudo apt-get --option Acquire::Retries=5 install --yes zsh php-cli php-sqlite3
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Install the web toolchain and the relay
      run: |
        npm ci
        npm ci --prefix relay
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    # the browsers the Android devices pair with
    - name: Install Chromium and WebKit
      run: npx playwright-core install --with-deps chromium webkit
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/mise/installs/android-sdk
        key: android-sdk-${{ runner.os }}-${{ hashFiles('mise.android.toml', 'scripts/android.ts') }}
        restore-keys: android-sdk-${{ runner.os }}-
    - name: Boot the emulator
      timeout-minutes: 8
      run: |
        # else tee's success hides a failed boot, and the soak runs on an emulator half set up
        set -o pipefail
        mkdir -p build/soak
        mise exec -- node scripts/android.ts 2>&1 | tee build/soak/boot.txt
    - name: The scenarios on Android, over and over
      run: |
        mise exec -- scripts/android-load.sh build/soak/load.txt &
        failed=0
        for i in $(seq 1 "$RUNS"); do
          echo "::group::run $i"
          mise exec -- node --test --test-force-exit --test-name-pattern android scenarios/browsers.e2e.ts > "build/soak/run-$i.txt" 2>&1 || {
            failed=1
            echo "::error::run $i failed"
          }
          grep -E '^(✔|✖|ℹ (pass|fail))' "build/soak/run-$i.txt" || true
          echo "::endgroup::"
        done
        exit $failed
    - name: Keep the emulator's log and screen
      if: ${{ always() }}
      # bounded, as the upload after it runs only once this step ends
      timeout-minutes: 5
      run: |
        cp -R build/touches build/scenarios build/android-*.png build/android-emulator.log build/soak/ 2>/dev/null || true
        mise exec -- scripts/android-capture.sh build/soak
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: soak-${{ matrix.shard }}
        path: build/soak
