name: Breezy
options:
  bundleIdPrefix: local.breezy
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  BreezyKit:
    path: BreezyKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Breezy:
    type: application
    platform: macOS
    sources: [Breezy]
    dependencies:
      - package: BreezyKit
      - package: Sparkle
    info:
      path: Breezy/Info.plist
      properties:
        CFBundleDisplayName: Breezy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: Breezy
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        # empty off main, where the updater stays off
        SUFeedURL: $(BREEZY_UPDATE_FEED)
        SUPublicEDKey: $(BREEZY_UPDATE_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.breezy.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        BREEZY_UPDATE_FEED: ""
        BREEZY_UPDATE_KEY: MQp6FNCCHOb2mPuFpT8eF4xdSooNG5WHq0n9hwVVOQE=
  BreezyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [BreezyUITests]
    dependencies:
      - target: Breezy
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Breezy
schemes:
  Breezy:
    build:
      targets:
        Breezy: all
    test:
      targets: [BreezyUITests]
