<link rel="stylesheet" href="style.css">
<title>Breezy</title>
<script type="module" src="main.js"></script>

<body data-screen="board">
<div id="board">
  <div class="world"><div class="lanes"></div><div class="cards"></div><div class="marquee" hidden></div></div>
  <div class="presence"></div>
</div>

<header id="top">
  <div class="pill">
    <button data-act="boards" aria-label="Boards" hidden><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <button data-act="undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button data-act="redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  </div>
  <div class="people" hidden></div>
  <div class="pill">
    <button data-act="search" aria-label="Find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
    <button data-act="more" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </div>
</header>

<section id="boards">
  <header class="boards-top">
    <h1>Boards</h1>
    <div class="pill"><button data-act="more" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
  </header>
  <div class="boards-groups"></div>
</section>

<div id="sheet" hidden>
  <form class="sheet-card">
    <p class="sheet-title"></p>
    <p class="sheet-message"></p>
    <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="sheet-choices" hidden></div>
    <div class="sheet-buttons">
      <button type="button" data-sheet="cancel">Cancel</button>
      <button type="button" data-sheet="danger" class="danger"></button>
      <button type="submit" data-sheet="ok" class="strong">OK</button>
    </div>
  </form>
</div>

<div id="zoom-level" hidden></div>

<div class="menu more" hidden>
  <p class="status" hidden></p>
  <button data-act="new-space">New Space</button>
  <button data-act="join">Join Space</button>
  <button data-act="your-name">Your Name</button>
  <button data-act="version" data-version="dev">Version</button>
</div>

<div class="menu space" hidden>
  <button data-act="rename-space">Rename Space</button>
  <button data-act="share">Share Invite</button>
  <button data-act="leave-space">Leave Space</button>
</div>

<div id="find" hidden>
  <label class="field">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input type="search" placeholder="Find" enterkeyhint="search" autocomplete="off" autocorrect="off">
    <span class="count"></span>
    <button data-act="clear-find" class="clear" aria-label="Clear" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 9 6 6m0-6-6 6"/></svg></button>
  </label>
  <button data-act="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
  <button data-act="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  <button data-act="close-find">Cancel</button>
</div>

<footer id="bottom">
  <div class="add">
    <div class="menu" hidden><button data-act="new-card">Card</button><button data-act="new-lane">Lane</button></div>
    <button data-act="add" class="plus" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="selection" hidden>
    <div class="colours">
      <div class="menu" hidden>
        <button data-act="colour" data-colour="1"><i class="c1"></i>Yellow</button>
        <button data-act="colour" data-colour="2"><i class="c2"></i>Pink</button>
        <button data-act="colour" data-colour="3"><i class="c3"></i>Blue</button>
        <button data-act="colour" data-colour="4"><i class="c4"></i>Green</button>
        <button data-act="colour" data-colour="5"><i class="c5"></i>Grey</button>
      </div>
      <button data-act="colours" class="swatch" aria-label="Colour"><i class="c1"></i></button>
    </div>
    <button data-act="turn" aria-label="Turn over"><svg viewBox="0 0 24 24"><path d="M3 6h18v8l-5 5H3z"/><path d="M21 14h-4a1 1 0 0 0-1 1v4"/><path d="M7 10h10M7 14h5"/></svg></button>
    <button data-act="delete" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
</footer>

<div id="keys" hidden><button data-act="key-turn">Turn</button><button data-act="key-done" class="strong">Done</button></div>

<div class="measure" aria-hidden="true"></div>
</body>
</html>
